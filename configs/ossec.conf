<!-- ============================================================================== -->
<!-- SOC/NOC Hybrid Lab - Custom Wazuh Agent Configuration                          -->
<!-- Target: dmz-web01 (10.10.30.102)                                               -->
<!-- Purpose: Ingest Nginx web access logs to detect OWASP Top 10 attacks.          -->
<!-- ============================================================================== -->

<ossec_config>
  <!-- Default Agent Configuration -->
  <client>
    <server>
      <address>10.10.10.50</address> <!-- Management LAN Server -->
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
  </client>

  <!-- Custom Log Ingestion for Web Attacks -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>
  
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/error.log</location>
  </localfile>
</ossec_config>